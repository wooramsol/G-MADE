name: Auto merge to production

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - cursor/g-made-hybrid-evaluation-0398

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-merge:
    if: >-
      github.event.pull_request.draft == false &&
      startsWith(github.head_ref, 'cursor/') &&
      github.event.pull_request.head.ref != 'cursor/g-made-hybrid-evaluation-0398'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --merge --delete-branch
